name: Build and Push

on:
  push:
    branches:
      - main

env:
  ECR_PUBLIC_REGISTRY: public.ecr.aws/medic
  ECR_REPOSITORY: superset
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both runners are pinned to the same Ubuntu version so the two halves of
        # the manifest are built on matching hosts. There is no "ubuntu-latest-arm",
        # so using ubuntu-latest for amd64 would drift away from the pinned arm64
        # runner as soon as ubuntu-latest moves to a new release.
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Artifact names can't contain "/", so linux/amd64 -> linux-amd64
    - name: Prepare platform name
      run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      env:
        PLATFORM: ${{ matrix.platform }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Amazon Public ECR
      uses: docker/login-action@v3
      with:
        registry: public.ecr.aws
        username: ${{ env.AWS_ACCESS_KEY_ID }}
        password: ${{ env.AWS_SECRET_ACCESS_KEY }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Each architecture is pushed untagged, identified only by its digest. The
    # merge job below stitches the digests together into the tags we publish.
    - name: Build and push image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        provenance: false
        outputs: type=image,name=${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest='${{ steps.build.outputs.digest }}'
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from Dockerfile
      id: extract_version
      run: |
        VERSION=$(grep -oP 'FROM\s+apache/superset:\K[^\s]+' Dockerfile)
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Amazon Public ECR
      uses: docker/login-action@v3
      with:
        registry: public.ecr.aws
        username: ${{ env.AWS_ACCESS_KEY_ID }}
        password: ${{ env.AWS_SECRET_ACCESS_KEY }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        IMAGE="${ECR_PUBLIC_REGISTRY}/${ECR_REPOSITORY}"
        docker buildx imagetools create \
          --tag "${IMAGE}:latest" \
          --tag "${IMAGE}:${{ steps.extract_version.outputs.version }}" \
          $(printf "${IMAGE}@sha256:%s " *)

    - name: Inspect published image
      run: |
        docker buildx imagetools inspect \
          "${ECR_PUBLIC_REGISTRY}/${ECR_REPOSITORY}:${{ steps.extract_version.outputs.version }}"
