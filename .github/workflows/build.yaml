name: Build and Push

on:
  push:
    branches:
      - main
  # Pull requests build both platforms but publish nothing, so a PR can prove the
  # arm64 build works before anything reaches the registry.
  pull_request:

env:
  ECR_PUBLIC_REGISTRY: public.ecr.aws/medic
  ECR_REPOSITORY: superset
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
jobs:
  build:
    name: Make docker file and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from Dockerfile
      id: extract_version
      run: |
        VERSION=$(grep -oP 'FROM\s+apache/superset:\K[^\s]+' Dockerfile)
        echo "VERSION=$VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # arm64 is built by emulating it on this amd64 runner. Nothing in the image is
    # compiled from source -- the slow steps are an apt unpack and a Chromium
    # download, both of which run at native speed -- so emulation costs little.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      if: github.event_name != 'pull_request'
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Amazon Public ECR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: public.ecr.aws
        username: ${{ env.AWS_ACCESS_KEY_ID }}
        password: ${{ env.AWS_SECRET_ACCESS_KEY }}

    # provenance is disabled so the published tag is a plain two-platform manifest
    # list, without the unknown/unknown attestation entries buildx adds by default.
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        provenance: false
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.extract_version.outputs.version }}

    - name: Inspect published image
      if: github.event_name != 'pull_request'
      run: |
        docker buildx imagetools inspect \
          "${ECR_PUBLIC_REGISTRY}/${ECR_REPOSITORY}:${{ steps.extract_version.outputs.version }}"
